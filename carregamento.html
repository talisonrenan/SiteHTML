<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Concluído</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            color: #2eadc4;
        }

        .success-message {
            font-size: 24px;
            color: green;
        }

        .redirect-message {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>
    <div>
        <h1>Cadastro Concluído!</h1>
        <p class="success-message">Seu cadastro foi feito com sucesso!</p>
        <p class="redirect-message">Você será redirecionado em 3 segundos...</p>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "page.html";
        }, 3000);
    </script>
</body>

</html>
